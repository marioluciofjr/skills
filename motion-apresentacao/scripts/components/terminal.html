<!-- terminal.html — bloco de código/fórmula digitado caractere a caractere.
     Receita: M.recipes.terminal('#sX .term', t, duracao)
     Dados: [data-type] = texto a digitar (até ~70 caracteres em 1640px de largura).
     Ideal para: fórmula de uma métrica, comando, prompt, regra de negócio. -->
<div class="term" style="left:140px;top:760px;width:1640px;height:140px">
  <div class="lbl">rótulo do bloco</div>
  <pre><span class="p">› </span><span data-type="metrica = (valor_bruto / base) × 1000"></span><span class="caret" style="height:30px"></span></pre>
</div>
